x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://vendor:vendor@db:5432/vendor_onboarding
  REDIS_URL: redis://redis:6379/0
  UPLOAD_DIR: /data/uploads
  # Uses the dev default unless SECRET_KEY is set in your shell or a root .env file.
  SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me-in-production}

services:
  db:
    image: pgvector/pgvector:pg16   # pgvector preinstalled for the RAG phase
    environment:
      POSTGRES_USER: vendor
      POSTGRES_PASSWORD: vendor
      POSTGRES_DB: vendor_onboarding
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor -d vendor_onboarding"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine           # Celery message broker
    command: redis-server --loglevel warning
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    command: ["api"]                # runs migrations, then the web server
    environment: *app-env
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  worker:
    build: ./backend
    command: ["worker"]             # Celery worker processing background jobs
    environment: *app-env
    volumes: [uploads:/data/uploads]   # same files the API stored
    depends_on:
      api: { condition: service_healthy }   # wait until migrations have run
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
