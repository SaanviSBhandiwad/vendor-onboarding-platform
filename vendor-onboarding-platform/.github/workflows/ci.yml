name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vendor
          POSTGRES_PASSWORD: vendor
          POSTGRES_DB: vendor_onboarding
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vendor" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vendor:vendor@localhost:5432/vendor_onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations apply and match models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vendor-onboarding-api ./backend
